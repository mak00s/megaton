name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run all tests
        run: python -m pytest tests/ -v --cov=megaton --cov-report=term-missing --cov-fail-under=70

  typecheck:
    name: Type check (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check typed public API and static modules
        run: python -m pyright

  typecheck-all:
    name: Type check (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Record typing environment
        run: python -m pip freeze > pyright-environment.txt
      - name: Analyze the full package
        run: |
          python scripts/pyright_report.py \
            --baseline .github/pyright-baseline.json \
            --output pyright-report.json \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Pyright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyright-report
          path: |
            pyright-report.json
            pyright-environment.txt
          if-no-files-found: warn
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build package
        run: python -m build
      - name: Validate package
        run: python -m twine check dist/*
